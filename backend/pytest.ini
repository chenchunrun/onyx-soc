[pytest]
pythonpath = 
    .
    generated/onyx_openapi_client
asyncio_default_fixture_loop_scope = function
markers =
    slow: marks tests as slow
    alembic: marks tests for alembic migration testing
    live: marks tests that call a real LLM or external service (slow, may cost money). Use -m "not live" to skip them.
    glm5_live: marks live regression tests that require the real glm-5 model to be configured as the default text model
filterwarnings =
    ignore::DeprecationWarning
    ignore::cryptography.utils.CryptographyDeprecationWarning
    ignore::PendingDeprecationWarning:ddtrace.internal.module
# .test.env is gitignored.
# After installing pytest-dotenv,
# you can use it to test credentials locally.
env_files =
    .test.env
