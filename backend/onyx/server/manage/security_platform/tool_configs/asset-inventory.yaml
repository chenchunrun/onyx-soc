name: lookup_asset_context
template: asset_inventory_api
description: >-
  Query CMDB or asset inventory metadata by hostname, IP, or owner. Use this
  when assessing incident blast radius, identifying system ownership, or
  checking asset criticality before recommending response actions.
api_url_env: SECURITY_ASSET_API_URL
api_key_env: SECURITY_ASSET_API_KEY
persona_bindings:
  - 安全事件分析师
  - 漏洞评估专家
  - 合规审计员
  - 威胁狩猎工程师
  - 恶意软件分析师
  - 检测工程师
