profiles:
  live:
    description: Use real security integration endpoints configured via standard env vars.
    env_overrides: {}
  gateway:
    description: Route security tools through an internal security tools gateway instead of direct vendor endpoints.
    env_overrides:
      SECURITY_ALERT_WEBHOOK_URL: SECURITY_TOOLS_GATEWAY_URL
      SECURITY_TICKET_API_URL: SECURITY_TOOLS_GATEWAY_URL
      SECURITY_TICKET_API_KEY: SECURITY_TOOLS_GATEWAY_API_KEY
      THREAT_INTEL_API_URL: SECURITY_TOOLS_GATEWAY_URL
      THREAT_INTEL_API_KEY: SECURITY_TOOLS_GATEWAY_API_KEY
      SECURITY_SIEM_API_URL: SECURITY_TOOLS_GATEWAY_URL
      SECURITY_SIEM_API_KEY: SECURITY_TOOLS_GATEWAY_API_KEY
      SECURITY_EDR_API_URL: SECURITY_TOOLS_GATEWAY_URL
      SECURITY_EDR_API_KEY: SECURITY_TOOLS_GATEWAY_API_KEY
      SECURITY_ASSET_API_URL: SECURITY_TOOLS_GATEWAY_URL
      SECURITY_ASSET_API_KEY: SECURITY_TOOLS_GATEWAY_API_KEY
  mock:
    description: Route security tools to the local mock server for demo and offline environments.
    env_overrides:
      SECURITY_ALERT_WEBHOOK_URL: SECURITY_TOOLS_MOCK_SERVER_URL
      SECURITY_TICKET_API_URL: SECURITY_TOOLS_MOCK_SERVER_URL
      SECURITY_TICKET_API_KEY: SECURITY_TOOLS_MOCK_API_KEY
      THREAT_INTEL_API_URL: SECURITY_TOOLS_MOCK_SERVER_URL
      THREAT_INTEL_API_KEY: SECURITY_TOOLS_MOCK_API_KEY
      SECURITY_SIEM_API_URL: SECURITY_TOOLS_MOCK_SERVER_URL
      SECURITY_SIEM_API_KEY: SECURITY_TOOLS_MOCK_API_KEY
      SECURITY_EDR_API_URL: SECURITY_TOOLS_MOCK_SERVER_URL
      SECURITY_EDR_API_KEY: SECURITY_TOOLS_MOCK_API_KEY
      SECURITY_ASSET_API_URL: SECURITY_TOOLS_MOCK_SERVER_URL
      SECURITY_ASSET_API_KEY: SECURITY_TOOLS_MOCK_API_KEY
