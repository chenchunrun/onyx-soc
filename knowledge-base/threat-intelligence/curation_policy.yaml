version: 1
manifest_exclude_paths:
  - knowledge-base/威胁情报/feeds/CVE_2026_35616.md
promotion_rules:
  allow_sources:
    - NIST National Vulnerability Database (NVD)
  require_fields:
    - source
    - retrieved_at
    - title
  reject_if_text_contains:
    - No description available.
review_rules:
  low_quality_sources:
    - CISA Known Exploited Vulnerabilities Catalog
  low_quality_markers:
    - No description available.
    - "*Last Updated: *"
    - "*Retrieved: *"
quality_rules:
  authoritative_sources:
    - NIST National Vulnerability Database (NVD)
  required_fields:
    - source
    - retrieved_at
    - title
  limited_quality_markers:
    - No description available.
lifecycle_rules:
  active_year_threshold: 2023
  archive_candidate_year_threshold: 2015
  archive_candidate_quality_tiers:
    - authoritative
    - standard
    - limited
  archive_exempt_sources: []
  archive_exempt_cve_ids:
    - CVE-2026-35616
output:
  report_path: knowledge-base/threat-intelligence/unmanaged_feed_report.json
  lifecycle_report_path: knowledge-base/threat-intelligence/lifecycle_report.json
  archive_plan_path: knowledge-base/threat-intelligence/archive_plan.json
  archive_batches_path: knowledge-base/threat-intelligence/archive_batches.json
  archive_worklist_dir: knowledge-base/threat-intelligence/archive_worklists
  archive_patch_preview_dir: knowledge-base/threat-intelligence/archive_patch_previews
  archive_action_script_dir: knowledge-base/threat-intelligence/archive_action_scripts
