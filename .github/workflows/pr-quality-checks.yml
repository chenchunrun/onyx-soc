name: Quality Checks PR
concurrency:
  group: Quality-Checks-PR-${{ github.workflow }}-${{ github.head_ref || github.event.workflow_run.head_branch || github.run_id }}
  cancel-in-progress: true

on:
  merge_group:
  pull_request: null
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  quality-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # ratchet:actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # ratchet:hashicorp/setup-terraform@v4.0.0
      - name: Setup node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # ratchet:actions/setup-node@v6
        with: # zizmor: ignore[cache-poisoning]
          node-version: 22
          cache: "npm"
          cache-dependency-path: ./web/package-lock.json
      - name: Install node dependencies
        working-directory: ./web
        run: npm ci
      - uses: j178/prek-action@0bb87d7f00b0c99306c8bcb8b8beba1eb581c037 # ratchet:j178/prek-action@v1
        with:
          prek-version: '0.3.4'
          # For PRs/merge-groups, only check changed files.
          # For pushes to main, use --files with the changed files from the commit
          # (instead of --all-files which checks 2000+ upstream files that predate
          # this fork's pre-commit config).
          extra-args: ${{ github.event_name == 'pull_request' && format('--from-ref {0} --to-ref {1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || github.event_name == 'merge_group' && format('--from-ref {0} --to-ref {1}', github.event.merge_group.base_sha, github.event.merge_group.head.sha) || '' }}
      - name: Check Actions
        uses: giner/check-actions@28d366c7cbbe235f9624a88aa31a628167eee28c # ratchet:giner/check-actions@v1.0.1
        with:
          check_permissions: false
          check_versions: false
      - name: License Scope Gate
        continue-on-error: true
        run: bash scripts/release/check_license_scope.sh
      - name: MIT-only Bundle Gate
        continue-on-error: true
        run: |
          bash scripts/release/build_mit_only_bundle.sh dist/release ci-check
          tar -tzf dist/release/cmsoc-mit-ci-check.tar.gz > dist/release/manifest.txt
          if rg -n '(^|/)backend/ee/|(^|/)web/src/app/ee/|(^|/)web/src/ee/' dist/release/manifest.txt; then
            echo "EE-licensed paths found in MIT-only bundle. Failing gate."
            exit 1
          fi
