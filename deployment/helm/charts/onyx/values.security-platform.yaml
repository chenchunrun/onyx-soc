# Example Helm values overlay for the Onyx security-platform customization.
#
# Usage:
#   helm upgrade --install onyx ./charts/onyx \
#     -n onyx --create-namespace \
#     -f values.yaml \
#     -f values.security-platform.yaml
#
# Replace the placeholder values below before using this overlay in a real
# environment.

configMap:
  # Optional public-facing URL for the deployed Onyx instance.
  WEB_DOMAIN: "https://onyx.example.com"

  # Default to the live profile. For gateway-routed environments, switch these to:
  #   SECURITY_PLATFORM_DEPLOYMENT_PROFILE: "gateway"
  #   THREAT_INTEL_SOURCE_PROFILE: "live"
  #   SECURITY_TOOLS_PROFILE: "gateway"
  #   SECURITY_TOOLS_GATEWAY_URL: "http://host.docker.internal:9999"
  #
  # For demo/offline environments, switch these to:
  #   SECURITY_PLATFORM_DEPLOYMENT_PROFILE: "demo"
  #   THREAT_INTEL_SOURCE_PROFILE: "mock"
  #   SECURITY_TOOLS_PROFILE: "mock"
  #   SECURITY_TOOLS_MOCK_SERVER_URL: "http://host.docker.internal:9999"
  SECURITY_PLATFORM_DEPLOYMENT_PROFILE: "live"
  THREAT_INTEL_SOURCE_PROFILE: "live"
  SECURITY_TOOLS_PROFILE: "live"

  # Security tool integration endpoints used by the live profile.
  SECURITY_TICKET_API_URL: "https://your-company.atlassian.net/rest/api/3"
  THREAT_INTEL_API_URL: "https://www.virustotal.com/api/v3"
  SECURITY_SIEM_API_URL: "https://siem.example.com/api/v1"
  SECURITY_EDR_API_URL: "https://edr.example.com/api/v1"
  SECURITY_ASSET_API_URL: "https://cmdb.example.com/api/v1"

  # Used only when SECURITY_TOOLS_PROFILE=gateway.
  SECURITY_TOOLS_GATEWAY_URL: ""

  # Used only when SECURITY_TOOLS_PROFILE=mock.
  SECURITY_TOOLS_MOCK_SERVER_URL: ""

auth:
  securityPlatform:
    enabled: true
    secretName: "onyx-security-platform"
    existingSecret: ""
    secretKeys:
      SECURITY_ALERT_WEBHOOK_URL: security_alert_webhook_url
      SECURITY_TICKET_API_KEY: security_ticket_api_key
      THREAT_INTEL_API_KEY: threat_intel_api_key
      SECURITY_SIEM_API_KEY: security_siem_api_key
      SECURITY_EDR_API_KEY: security_edr_api_key
      SECURITY_ASSET_API_KEY: security_asset_api_key
      SECURITY_TOOLS_GATEWAY_API_KEY: security_tools_gateway_api_key
      SECURITY_TOOLS_MOCK_API_KEY: security_tools_mock_api_key
      ENCRYPTION_KEY_SECRET: encryption_key_secret
    values:
      security_alert_webhook_url: "https://hooks.slack.com/services/replace-me"
      security_ticket_api_key: "replace-me"
      threat_intel_api_key: "replace-me"
      security_siem_api_key: "replace-me"
      security_edr_api_key: "replace-me"
      security_asset_api_key: "replace-me"
      security_tools_gateway_api_key: "replace-me"
      security_tools_mock_api_key: "mock-api-key-for-testing"
      encryption_key_secret: "replace-me"
